detector:
  backend: drone
  weights_path: models/dut_v1/weights.pt
  confidence_threshold: 0.35
  nms_thresh: 0.45
tracker:
  backend: iou
iou_threshold: 0.5
small_object_area_px: 1024.0
expected_checksum: 809666705d6cf3fd651e858659db3e9f5d86ef2a04208a0855c55c6f27ecd44c
output_json_path: eval/output/fpv_test_dut_v1_sunny_metric_card.json
