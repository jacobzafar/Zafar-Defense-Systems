# eval/harness.py config for the frozen DUT Anti-UAV test split, evaluating
# the "drone" backend (weights fine-tuned by config/dut_train.yaml). See
# docs/datasets.md for the eval set's provenance and eval/REPORT.md for the
# resulting metric card.
eval_set_dir: data/frozen_eval/dut-anti-uav-test
detector:
  backend: drone
  weights_path: models/dut_v1/weights.pt
  confidence_threshold: 0.35
tracker:
  backend: iou
iou_threshold: 0.5
small_object_area_px: 1024.0
expected_checksum: d7d58f3a2e22d3aec8814ae47f38ee145a735f53c4e9cab16c8732a1eaa2244c
output_json_path: eval/output/dut_anti_uav_metric_card.json
output_report_path: eval/REPORT.md
