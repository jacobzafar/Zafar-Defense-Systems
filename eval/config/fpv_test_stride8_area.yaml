# eval/harness.py config — docs/DECISIONS.md #27 Phase 1 (A1): opt-in latency option, confirmation run on test.
# stride-8 (#26 model, unchanged; RESEARCH ONLY) with resize_interp: area (cv2.INTER_AREA to 640 on the CPU).
# NOT selected as default: on val it tied the baseline on accuracy (AP 0.9431 vs 0.9432) and was 13% faster
# (eval/bench_latency.py, 94.9 vs 109.0 ms/frame on this CPU). This run only checks it is accuracy-neutral on test.
# Compare against fpv_test_stride8_clips.yaml (same frames, same clip view).
eval_set_dir: data/frozen_eval/visiodect-fpv-test
detector:
  backend: drone
  weights_path: models/stride8_fpv/weights_best.pt
  input_size: 640
  architecture: ssdlite_stride8
  anchor_scales: [0.025, 0.042036, 0.070682, 0.118848, 0.199836, 0.336014, 0.564989, 0.95]
  confidence_threshold: 0.35
  nms_thresh: 0.45
  resize_interp: area
tracker: {backend: iou}
iou_threshold: 0.5
small_object_area_px: 1024.0
expected_checksum: ce85b0d59a7e276df11dc4836a85cab6f81915e4e7afc28d8c0ec4b18b3b4bab
output_json_path: eval/output/fpv_test_stride8_area_metric_card.json
output_report_path: eval/output/fpv_test_stride8_area_REPORT.md
output_predictions_path: data/eval_predictions/fpv_test_stride8_area.jsonl.gz
sequence_grouping: filename_runs
