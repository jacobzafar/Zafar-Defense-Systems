# eval/harness.py config — docs/DECISIONS.md #26: dut_v1 (DUT-trained, never shown VisioDECT), untiled,
# on the held-out FPV test blocks (the Evening scenario only). Test set built with:
#   python tools/split_visiodect_fpv.py --source-dir data/visiodect/converted-fpv \
#       --output-dir data/visiodect/fpv-split
#   python -m eval.build_frozen_eval_set --source-dataset-dir data/visiodect/fpv-split/test-evening \
#       --eval-set-dir data/frozen_eval/visiodect-fpv-test-evening
# (per-scenario dirs: fpv-split/test filtered by its "scenario" key; see docs/fas0-feasibility.md).
eval_set_dir: data/frozen_eval/visiodect-fpv-test-evening
detector:
  backend: drone
  weights_path: models/dut_v1/weights.pt
  confidence_threshold: 0.35
  nms_thresh: 0.45
tracker:
  backend: iou
iou_threshold: 0.5
small_object_area_px: 1024.0
expected_checksum: e20ae959e90b73aaca484a2c396b6c2416086a57ae01556e7b910954cbf84252
output_json_path: eval/output/fpv_test_dut_v1_evening_metric_card.json
output_report_path: eval/output/fpv_test_dut_v1_evening_REPORT.md
output_predictions_path: data/eval_predictions/fpv_test_dut_v1_evening.jsonl.gz
