#   python tools/split_visiodect_fpv.py --source-dir data/visiodect/converted-fpv \
#       --output-dir data/visiodect/fpv-split
#   python -m eval.build_frozen_eval_set --source-dataset-dir data/visiodect/fpv-split/test \
#       --eval-set-dir data/frozen_eval/visiodect-fpv-test
